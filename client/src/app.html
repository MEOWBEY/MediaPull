<!doctype html>
<html lang="en" class="%sveltekit.theme%">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="Fast and reliable video downloader tool built with SvelteKit" />
	<meta name="keywords" content="video downloader, youtube downloader, video converter, online video tool" />
	<meta name="author" content="Video Extractor" />

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:title" content="Video Extractor - Video Downloader" />
	<meta property="og:description" content="Fast and reliable video downloader tool" />

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image" />

	<meta property="twitter:description" content="Fast and reliable video downloader tool" />

	%sveltekit.head%

<body data-sveltekit-preload-data="hover" class="min-h-screen bg-background font-sans antialiased">
	<div style="display: contents" class="relative flex min-h-screen flex-col">
		%sveltekit.body%
	</div>

</html>
