<!doctype html>
<html lang="en" class="%sveltekit.theme%">

<head>
	<meta charset="utf-8" />
	<!-- SVG first (crisp at any size, themeable); PNG is the fallback for
	     browsers that don't take SVG icons. -->
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" type="image/png" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
	<meta name="theme-color" content="#141518" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="MediaPull — paste a URL to get downloadable video formats and image galleries. Built-in player, optional subtitles, cookie support, and proxy when direct play fails." />
	<meta name="keywords" content="video link extractor, direct video url, yt-dlp, hls player, video proxy, sveltekit" />
	<meta name="author" content="MediaPull" />

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:title" content="MediaPull — Paste a link. Pull the media." />
	<meta property="og:description" content="Paste a page URL to extract video formats or image galleries. Preview, download, generate subtitles, or stream through the proxy." />

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image" />
	<meta property="twitter:title" content="MediaPull — Paste a link. Pull the media." />
	<meta property="twitter:description" content="Paste a page URL to extract video formats or image galleries. Preview, download, generate subtitles, or stream through the proxy." />

	<script>
		// Apply the saved theme before first paint to avoid a light/dark flash.
		try {
			var p = JSON.parse(localStorage.getItem('preferences') || '{}');
			var theme = p.theme || 'system';
			var dark =
				theme === 'dark' ||
				(theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
			if (dark) document.documentElement.classList.add('dark');
		} catch (e) {}
	</script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="min-h-screen bg-background font-sans antialiased">
	<div style="display: contents" class="relative flex min-h-screen flex-col">
		%sveltekit.body%
	</div>
</body>

</html>
