# Native static-site deploy of the CLIENT ONLY — no Docker, free, global
# CDN. Pair with a backend from ../../server/render/ (Docker) or any other
# host (Railway, Fly.io, your own VPS) for the API.

services:
  - type: web
    name: directstream-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      # Baked into the build by Vite — must be set BEFORE the build runs.
      - key: VITE_API_BASE_URL
        sync: false # set the actual value in the Render dashboard
    routes:
      # SPA fallback: unmatched paths resolve to index.html so client-side
      # routing works on refresh/deep-link.
      - type: rewrite
        source: /*
        destination: /index.html
