# Run these commands from the REPO ROOT (the build needs both client/ and
# server/ in its context):
#   fly launch --config deploy/server/flyio/fly.toml --dockerfile deploy/server/docker/Dockerfile --no-deploy
#   fly deploy  --config deploy/server/flyio/fly.toml --dockerfile deploy/server/docker/Dockerfile

app = "directstream"
primary_region = "iad"

[build]
  dockerfile = "deploy/server/docker/Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
