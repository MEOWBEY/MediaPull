# Native (non-Docker) build for the BACKEND service on Railway.
# Copy this file to server/nixpacks.toml and set that service's Root
# Directory to "server" — Railway's Nixpacks builder reads it from there.
#
# Adds the one system dependency the Python backend needs (ffmpeg) that
# isn't installed by Nixpacks' Python provider by default.

[phases.setup]
nixPkgs = ["ffmpeg"]

[start]
cmd = "python run.py"
