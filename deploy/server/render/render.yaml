services:
  - type: web
    name: directstream
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/server/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_IMPERSONATION
        value: "true"
      - key: VALIDATE_FORMATS
        value: "true"
      - key: CACHE_TTL
        value: "300"
    # PORT is injected by Render automatically; server/app/config.py already
    # reads it from the environment.
